name: Build M9 Pro DTB for ArkOS4Clones

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-dtb:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install DTC & Python
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends device-tree-compiler python3

      - name: Run Patch Script
        run: python3 patch.py

      - name: Upload Artefakte
        uses: actions/upload-artifact@v4
        with:
          name: m9-pro-patched-dtb
          path: |
            rk3326-m9pro-linux.dtb
            boot.ini
            patch_verification.log
          retention-days: 14

      - name: Commit & Push Patched Files
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CURRENT_BRANCH: ${{ github.ref_name }}
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add rk3326-m9pro-linux.dtb boot.ini patch_verification.log
          git diff --quiet && git diff --staged --quiet || git commit -m "build(dtb): patch M9 Pro device name & panel [skip ci]"
          git push origin "${CURRENT_BRANCH}" --force
