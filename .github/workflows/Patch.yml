name: Build M9 Pro DTB for ArkOS4Clones

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build-dtb:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install DTC & Python
        run: |
          sudo apt-get update
          sudo apt-get install -y device-tree-compiler python3

      - name: Patch DTB & boot.ini
        run: |
          python3 - << 'EOF'
          import re, subprocess, os, glob

          # Find the base DTB (excluding our output)
          dtb_files = [f for f in glob.glob("*.dtb") if not f.startswith("rk3326-m9pro")]
          if not dtb_files:
              print("ERROR: No DTB file found in repository root")
              exit(1)
          base_dtb = dtb_files[0]
          print(f"[*] Source DTB: {base_dtb}")

          # Decompile
          subprocess.run(["dtc", "-I", "dtb", "-O", "dts", "-f", "-o", "base.dts", base_dtb], check=True)
          with open("base.dts", "r", encoding="utf-8") as f:
              dts = f.read()

          # ---- Device name replacements ----
          # Specific strings first
          replacements = [
              ("aislpc r36t/k36", "M9 Pro - St0len-One"),
              ("aislpc r36t", "M9 Pro - St0len-One"),
              ("aislpc r36s", "M9 Pro - St0len-One"),
              ("aislpc r36", "M9 Pro - St0len-One"),
              ("r36t/k36", "M9 Pro - St0len-One"),
              ("r36t", "M9 Pro - St0len-One"),
              ("r36s", "M9 Pro - St0len-One"),
              ("k36s", "M9 Pro - St0len-One"),
              ("k36", "M9 Pro - St0len-One"),
              ("rk3326-k36s", "rk3326-m9pro"),
              ("rk3326-k36", "rk3326-m9pro"),
          ]
          for old, new in replacements:
              dts = dts.replace(old, new)

          # Fix root model (first occurrence)
          dts = re.sub(r'model\s*=\s*"[^"]*";', 'model = "M9 Pro - St0len-One";', dts, count=1)

          # Fix compatible: replace k36 in board part (e.g., rockchip,rk3326-k36 -> rockchip,rk3326-m9pro)
          dts = re.sub(r'(compatible\s*=\s*")([^"]*)(";)',
                       lambda m: m.group(1) + m.group(2).replace('k36', 'm9pro') + m.group(3),
                       dts, count=1)

          # ---- Add / update panel node ----
          # If there is a node named "panel", add model property if missing
          if re.search(r'\bpanel\s*\{', dts):
              dts = re.sub(r'(\bpanel\s*\{[^}]*?)(\bmodel\s*=\s*"[^"]*";)?',
                           lambda m: m.group(1) + '\n\t\tmodel = "M9 Pro Display";' if not m.group(2) else m.group(0),
                           dts, flags=re.DOTALL)
          else:
              # Insert a simple panel node in the root
              panel_node = '''
      panel {
          compatible = "simple-panel";
          model = "M9 Pro Display";
          status = "okay";
      };
'''
              last_brace = dts.rfind('};')
              if last_brace != -1:
                  dts = dts[:last_brace] + panel_node + "\n" + dts[last_brace:]

          # Add custom board property
          if 'm9pro,board' not in dts:
              dts = dts.replace('/ {', '/ {\n\tm9pro,board = "M9 Pro - St0len-One";', 1)

          # Write DTS and compile
          with open("merged.dts", "w", encoding="utf-8") as f:
              f.write(dts)

          output_dtb = "rk3326-m9pro-linux.dtb"
          print("[*] Compiling final DTB...")
          subprocess.run(["dtc", "-I", "dts", "-O", "dtb", "-f",
                          "-Wno-unique_unit_address", "-Wno-graph_child_address",
                          "-o", output_dtb, "merged.dts"], check=True)

          # ---- Patch boot.ini ----
          if os.path.exists("boot.ini"):
              with open("boot.ini", "r", encoding="utf-8") as f:
                  boot_ini = f.read()
              # Replace any .dtb filename with the new output name
              boot_ini_new = re.sub(r'[\w\-\.]*\.dtb', output_dtb, boot_ini)
              with open("boot.ini", "w", encoding="utf-8") as f:
                  f.write(boot_ini_new)
              print("[*] boot.ini updated to use", output_dtb)
          else:
              print("[!] boot.ini not found, skipping")

          # ---- Verification ----
          subprocess.run(["dtc", "-I", "dtb", "-O", "dts", "-f", "-o", "verify.dts", output_dtb], check=True)
          with open("verify.dts", "r", encoding="utf-8") as f:
              final_dts = f.read()

          log = [
              "==================================================",
              "      M9 PRO DTB PATCH & VERIFICATION",
              "==================================================",
              f"[+] Source DTB: {base_dtb}",
              f"[+] Output DTB: {output_dtb}",
              "[+] Device name replacements:",
          ]
          for old, new in replacements:
              log.append(f"  - {old} -> {new}: {'OK' if old not in final_dts else 'MISSING'}")
          log.append("[+] Root model: " + ("OK" if 'model = "M9 Pro - St0len-One";' in final_dts else "MISSING"))
          log.append("[+] Compatible board: " + ("OK" if 'rk3326-m9pro' in final_dts else "MISSING"))
          log.append("[+] Panel info: " + ("OK" if 'M9 Pro Display' in final_dts else "MISSING"))
          log.append("[+] m9pro,board property: " + ("OK" if 'm9pro,board' in final_dts else "MISSING"))
          log.append("[+] boot.ini updated: " + ("OK" if os.path.exists("boot.ini") and output_dtb in open("boot.ini").read() else "CHECK"))

          log_text = "\n".join(log)
          with open("patch_verification.log", "w", encoding="utf-8") as f:
              f.write(log_text)
          print(log_text)
          print("[✓] DTB patch completed successfully.")
          EOF

      - name: Upload Patched DTB, boot.ini & Log
        uses: actions/upload-artifact@v4
        with:
          name: m9-pro-patched-dtb
          path: |
            rk3326-m9pro-linux.dtb
            boot.ini
            patch_verification.log
          retention-days: 14

      - name: Commit and Push (force)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add rk3326-m9pro-linux.dtb boot.ini patch_verification.log
          git diff --quiet && git diff --staged --quiet || git commit -m "build(dtb): patch M9 Pro device name & panel for ArkOS4Clones [skip ci]"
          git push --force origin main
